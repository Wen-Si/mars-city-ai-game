<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' https://open.bigmodel.cn; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>火星城市 · AI 建造计划</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap">
  <style>

    :root {
      --mars-red: #c1440e;
      --mars-dark: #4a1910;
      --mars-light: #e8784a;
      --sand: #d4a574;
      --ink: #0d0a09;
      --panel: rgba(13, 10, 9, 0.78);
      --panel-border: rgba(255, 140, 80, 0.28);
      --glow: rgba(255, 120, 60, 0.55);
      --success: #4ade80;
      --info: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: #f3e6dc;
      font-family: 'Noto Sans SC', sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #0d0a09;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: grid;
      grid-template-areas:
        "header header header"
        "left center right";
      grid-template-columns: 320px 1fr 280px;
      grid-template-rows: auto 1fr;
      gap: 16px;
      padding: 18px;
    }

    .header { grid-area: header; }
    .left-col { grid-area: left; display: flex; flex-direction: column; gap: 16px; }
    .center-area { grid-area: center; pointer-events: none; min-width: 100px; }
    .right-col { grid-area: right; display: flex; flex-direction: column; gap: 16px; }

    .panel {
      pointer-events: auto;
      background: rgba(13, 10, 9, 0.65);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .panel:hover {
      box-shadow: 0 12px 40px rgba(193, 68, 14, 0.18), inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .center-area {
      pointer-events: none;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mars-light);
      text-shadow: 0 0 20px var(--glow);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--sand);
      letter-spacing: 1px;
      opacity: 0.85;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 12px;
      border-left: 3px solid var(--mars-red);
    }

    .stat-label {
      font-size: 11px;
      color: var(--sand);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      color: #fff;
    }

    .btn {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--mars-red), #9a2e08);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(193, 68, 14, 0.35);
      transition: all 0.2s ease;
      margin-top: 14px;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::after { left: 100%; }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(193, 68, 14, 0.5);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--panel-border);
      box-shadow: none;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: rgba(255, 140, 80, 0.08);
      box-shadow: 0 4px 16px rgba(193, 68, 14, 0.2);
    }

    .log {
      flex: 1;
      min-height: 180px;
      max-height: 320px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.65;
      color: #e8d4c4;
    }

    .log-entry {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      animation: fadeIn 0.5s ease;
    }

    .log-entry:last-child { border-bottom: none; }

    .log-step {
      font-family: 'Orbitron', sans-serif;
      color: var(--mars-light);
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .log-title {
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .log-reason {
      color: var(--sand);
      font-size: 12px;
      word-break: break-word;
    }

    .building-card {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      border: 1px solid rgba(255,140,80,0.15);
    }

    .building-card .name {
      font-family: 'Orbitron', sans-serif;
      color: var(--mars-light);
      font-size: 16px;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .building-card .meta {
      font-size: 12px;
      color: var(--sand);
      line-height: 1.6;
    }

    .loader {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 14px 24px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-width: 80vw;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .hint {
      font-size: 11px;
      color: rgba(212, 165, 116, 0.7);
      margin-top: 10px;
      line-height: 1.5;
    }

    .render-mode {
      font-size: 10px;
      color: var(--mars-light);
      background: rgba(193, 68, 14, 0.15);
      padding: 4px 8px;
      border-radius: 4px;
      margin-left: 10px;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--mars-red); border-radius: 3px; }

    @media (max-width: 800px) {
      #ui {
        grid-template-areas:
          "header"
          "left"
          "right";
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .center-area { display: none; }
      .panel { max-height: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="ui">
    <div class="panel header">
      <div>
        <h1>ARES · 火星城市 <span class="render-mode" id="render-mode-tag">Canvas 2D</span></h1>
        <div class="subtitle">AI 大模型驱动的火星殖民地逐步建造模拟器 · 基于 LingBot-World 世界模型理念</div>
      </div>
      <div style="text-align:right;">
        <div class="subtitle">SOL <span id="sol-counter">1</span></div>
        <div class="subtitle" id="status-text">等待启动</div>
      </div>
    </div>

    <div class="center-area"></div>

    <div class="left-col">
      <div class="panel">
        <div class="subtitle" style="margin-bottom:8px;">殖民地状态</div>
        <div class="stats-grid">
          <div class="stat">
            <div class="stat-label">建筑</div>
            <div class="stat-value" id="stat-buildings">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">人口</div>
            <div class="stat-value" id="stat-population">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">能源</div>
            <div class="stat-value" id="stat-energy">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">氧气</div>
            <div class="stat-value" id="stat-oxygen">0</div>
          </div>
        </div>
        <button class="btn" id="btn-next">下一步建造</button>
        <button class="btn btn-secondary" id="btn-auto">自动建造</button>
        <button class="btn btn-secondary" id="btn-reset">重置殖民地</button>
        <div class="hint">建筑由智谱 GLM-4.5-Flash 实时决策生成。广阔火星表面（±300坐标范围），拖动鼠标旋转视角，滚轮缩放。</div>
      </div>

      <div class="panel" style="flex:1; display:flex; flex-direction:column;">
        <div class="subtitle" style="margin-bottom:10px;">AI 决策日志</div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="panel">
        <div class="subtitle" style="margin-bottom:8px;">当前计划</div>
        <div id="current-plan" class="building-card">
          <div class="name">—</div>
          <div class="meta">暂无建造计划</div>
        </div>
      </div>

      <div class="panel" style="flex:1;">
        <div class="subtitle" style="margin-bottom:10px;">城市导览</div>
        <div class="log" id="building-list" style="max-height: 360px;"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      // ============ 安全工具函数 ============
      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
      }

      function sanitizeNumber(val, min, max, defaultValue) {
        const num = Number(val);
        if (isNaN(num) || !isFinite(num)) return defaultValue;
        return Math.max(min, Math.min(max, num));
      }

      function sanitizeString(str, maxLength) {
          if (str === null || str === undefined) return '';
          // 先移除控制字符，再进行HTML转义（结合textContent使用提供纵深防御）
          const s = String(str)
            .replace(/[\x00-\x1F\x7F\u202E\u202D\u200E\u200F]/g, '') // 移除控制字符和双向文本控制符
            .replace(/[<>"'&]/g, function(ch) {
              const entities = { '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '&': '&amp;' };
              return entities[ch];
            });
          return maxLength ? s.substring(0, maxLength) : s;
        }

      // ============ 配置 ============
      const CONFIG = Object.freeze({
        // 注意：这是纯前端Demo应用，API Key直接嵌入客户端是已知架构限制
        // 生产环境应通过后端代理转发API请求，前端不接触密钥
        // CSP connect-src已限制仅能向open.bigmodel.cn发送请求，部分缓解密钥滥用风险
        apiKey: '325d6fa364954d2e871c30ba95b553bd.KBdQdqgJgELJBhnv',
        apiUrl: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
        model: 'glm-4.5-flash',
        maxTokens: 512,
        cityRadius: 600,
        coordRange: 300,
        minSpacing: 60,
        requestTimeout: 30000,
        maxBuildings: 200,
        buildingColors: Object.freeze({
          '能源设施': '#ffaa44',
          '生命支持': '#44aaff',
          '居住区': '#eeeeee',
          '研究中心': '#cc77ff',
          '温室': '#55cc88',
          '工厂': '#888899',
          '交通设施': '#ff6644',
          '防御设施': '#cc3333',
          '存储设施': '#ddbb77',
          '通讯设施': '#66ddff',
          '默认': '#cccccc'
        }),
        allowedTypes: Object.freeze([
          '能源设施', '生命支持', '居住区', '研究中心',
          '温室', '工厂', '交通设施', '防御设施', '存储设施', '通讯设施', '默认'
        ])
      });

      // ============ DOM 缓存 ============
      const DOM = {};
      function cacheDOM() {
        DOM.canvas = document.getElementById('game-canvas');
        DOM.log = document.getElementById('log');
        DOM.buildingList = document.getElementById('building-list');
        DOM.currentPlan = document.getElementById('current-plan');
        DOM.statusText = document.getElementById('status-text');
        DOM.solCounter = document.getElementById('sol-counter');
        DOM.statBuildings = document.getElementById('stat-buildings');
        DOM.statPopulation = document.getElementById('stat-population');
        DOM.statEnergy = document.getElementById('stat-energy');
        DOM.statOxygen = document.getElementById('stat-oxygen');
        DOM.btnNext = document.getElementById('btn-next');
        DOM.btnAuto = document.getElementById('btn-auto');
        DOM.btnReset = document.getElementById('btn-reset');
        DOM.toast = document.getElementById('toast');
      }

      // ============ Canvas 2D 渲染器 ============
      class MarsCityRenderer {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');
          this.buildings = [];
          this.cameraAngle = 0;
          this.cameraHeight = 35;
          this.cameraDistance = 500;
          this.targetAngle = 0;
          this.dustParticles = [];
          this.stars = [];
          this.time = 0;
          this.animationId = null;
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.activeAnimations = new Set();
          this._eventListeners = []; // 跟踪事件监听器以便清理

          this.setupCanvas();

          // 保存resize处理器引用
          this._onResize = () => this.setupCanvas();
          window.addEventListener('resize', this._onResize);
          this._eventListeners.push({ target: window, type: 'resize', fn: this._onResize });

          this.isDragging = false;
          this.lastMouseX = 0;
          this.lastMouseY = 0;

          this._onMouseDown = (e) => {
            this.isDragging = true;
            this.lastMouseX = e.clientX;
            this.lastMouseY = e.clientY;
          };
          canvas.addEventListener('mousedown', this._onMouseDown);
          this._eventListeners.push({ target: canvas, type: 'mousedown', fn: this._onMouseDown });

          this._onMouseMove = (e) => {
            if (this.isDragging) {
              const dx = e.clientX - this.lastMouseX;
              const dy = e.clientY - this.lastMouseY;
              this.targetAngle += dx * 0.005;
              this.cameraHeight = Math.max(20, Math.min(100, this.cameraHeight - dy * 0.4));
              this.lastMouseX = e.clientX;
              this.lastMouseY = e.clientY;
            }
          };
          canvas.addEventListener('mousemove', this._onMouseMove);
          this._eventListeners.push({ target: canvas, type: 'mousemove', fn: this._onMouseMove });

          this._onMouseUp = () => { this.isDragging = false; };
          this._onMouseLeave = () => { this.isDragging = false; };
          canvas.addEventListener('mouseup', this._onMouseUp);
          this._eventListeners.push({ target: canvas, type: 'mouseup', fn: this._onMouseUp });
          canvas.addEventListener('mouseleave', this._onMouseLeave);
          this._eventListeners.push({ target: canvas, type: 'mouseleave', fn: this._onMouseLeave });

          this._onWheel = (e) => {
            e.preventDefault();
            this.cameraDistance = Math.max(180, Math.min(1000, this.cameraDistance + e.deltaY * 0.6));
          };
          canvas.addEventListener('wheel', this._onWheel, { passive: false });
          this._eventListeners.push({ target: canvas, type: 'wheel', fn: this._onWheel, opts: { passive: false } });

          this.initParticles();
          this.initStars();

          this.startAnimation();
        }

        setupCanvas() {
          const dpr = window.devicePixelRatio || 1;
          this.width = window.innerWidth;
          this.height = window.innerHeight;

          this.canvas.width = this.width * dpr;
          this.canvas.height = this.height * dpr;

          this.ctx.setTransform(1, 0, 0, 1, 0, 0);
          this.ctx.scale(dpr, dpr);

          this.initParticles();
          this.initStars();
        }

        initParticles() {
          this.dustParticles = [];
          for (let i = 0; i < 80; i++) {
            this.dustParticles.push({
              x: Math.random() * this.width,
              y: Math.random() * this.height,
              size: Math.random() * 2 + 0.5,
              speed: Math.random() * 0.3 + 0.1,
              opacity: Math.random() * 0.3 + 0.1
            });
          }
        }

        initStars() {
          this.stars = [];
          for (let i = 0; i < 200; i++) {
            this.stars.push({
              x: Math.random() * this.width,
              y: Math.random() * this.height * 0.6,
              size: Math.random() * 1.5 + 0.3,
              twinkle: Math.random() * Math.PI * 2,
              speed: Math.random() * 0.02 + 0.01
            });
          }
        }

        destroy() {
          if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
          }
          this.activeAnimations.clear();
          this.buildings = [];
          // 移除所有跟踪的事件监听器
          if (this._eventListeners) {
            for (const listener of this._eventListeners) {
              try {
                listener.target.removeEventListener(listener.type, listener.fn, listener.opts);
              } catch (e) { /* 忽略清理错误 */ }
            }
            this._eventListeners = [];
          }
        }

        animate() {
          this.time += 0.016;
          this.cameraAngle += (this.targetAngle - this.cameraAngle) * 0.05;
          this.render();
          this.animationId = requestAnimationFrame(() => this.animate());
        }

        startAnimation() {
          if (this.animationId) cancelAnimationFrame(this.animationId);
          this.animate();
        }

        render() {
          if (!this.ctx || !this.width || !this.height) return;

          const ctx = this.ctx;
          const w = this.width;
          const h = this.height;

          ctx.fillStyle = '#0d0a09';
          ctx.fillRect(0, 0, w, h);

          this.stars.forEach(star => {
            star.twinkle += star.speed;
            const opacity = 0.3 + Math.sin(star.twinkle) * 0.3;
            ctx.fillStyle = `rgba(255, 245, 230, ${opacity})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
          });

          const gradient = ctx.createLinearGradient(0, h * 0.35, 0, h);
          gradient.addColorStop(0, '#2a1510');
          gradient.addColorStop(0.3, '#4a1910');
          gradient.addColorStop(0.6, '#6a2515');
          gradient.addColorStop(1, '#8a3018');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, h * 0.35, w, h * 0.65);

          this.drawGroundGrid();

          this.dustParticles.forEach(p => {
            p.x += p.speed;
            if (p.x > w) p.x = 0;
            ctx.fillStyle = `rgba(212, 165, 116, ${p.opacity})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          });

          this.drawBuildings();
          this.drawSunGlow();
        }

        drawGroundGrid() {
          const ctx = this.ctx;
          const centerX = this.width / 2;
          const centerY = this.height * 0.55;
          const gridRadius = 600;

          ctx.strokeStyle = 'rgba(255, 180, 100, 0.20)';
          ctx.lineWidth = 1.2;

          for (let r = 40; r <= gridRadius; r += 60) {
            const perspectiveR = r * (1 - this.cameraHeight / 300);
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, perspectiveR, perspectiveR * 0.4, 0, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.strokeStyle = 'rgba(255, 150, 80, 0.15)';
          ctx.lineWidth = 0.8;

          for (let i = 0; i < 20; i++) {
            const angle = (i / 20) * Math.PI * 2 + this.cameraAngle;
            const x1 = centerX;
            const y1 = centerY;
            const x2 = centerX + Math.cos(angle) * gridRadius * (1 - this.cameraHeight / 300);
            const y2 = centerY + Math.sin(angle) * gridRadius * 0.4 * (1 - this.cameraHeight / 300);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        }

        drawSunGlow() {
          const ctx = this.ctx;
          const sunX = this.width * 0.75;
          const sunY = this.height * 0.15;

          const gradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 80);
          gradient.addColorStop(0, 'rgba(255, 200, 100, 0.4)');
          gradient.addColorStop(0.5, 'rgba(255, 150, 80, 0.15)');
          gradient.addColorStop(1, 'rgba(255, 100, 50, 0)');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
          ctx.fill();
        }

        drawBuildings() {
          const ctx = this.ctx;
          const centerX = this.width / 2;
          const centerY = this.height * 0.55;

          const sortedBuildings = [...this.buildings].sort((a, b) => {
            const distA = Math.sqrt(a.x * a.x + a.z * a.z);
            const distB = Math.sqrt(b.x * b.x + b.z * b.z);
            return distB - distA;
          });

          const screenPositions = [];
          sortedBuildings.forEach(b => {
            const pos = this.getBuildingScreenPos(b, centerX, centerY);
            screenPositions.push({ building: b, ...pos });
          });

          screenPositions.forEach(sp => {
            this.drawBuildingShape(sp.building, sp.screenX, sp.screenY, sp.buildingScale, centerY);
          });

          const labelRects = [];
          screenPositions.forEach(sp => {
            if (!sp.building.showLabel) return;
            const safeName = sanitizeString(sp.building.building, 20);
            const labelText = safeName.length > 8
              ? safeName.substring(0, 7) + '…'
              : safeName;
            const fontSize = Math.max(9, 12 * sp.perspective);
            const alpha = Math.max(0.5, Math.min(1, sp.perspective * 1.5));

            ctx.font = `bold ${fontSize}px "Noto Sans SC"`;
            const textWidth = ctx.measureText(labelText).width;
            let labelX = sp.screenX;
            let labelY = sp.screenY - sp.buildingScale * 38;

            const labelH = fontSize + 4;
            const labelW = textWidth + 10;
            let collision = true;
            let offsetAttempts = 0;

            while (collision && offsetAttempts < 12) {
              collision = false;
              for (const r of labelRects) {
                if (Math.abs(labelX - r.x) < (labelW + r.w) / 2 &&
                    Math.abs(labelY - r.y) < (labelH + r.h) / 2) {
                  collision = true;
                  if (offsetAttempts < 4) {
                    labelY -= labelH + 4;
                  } else if (offsetAttempts < 8) {
                    labelX = sp.screenX + (offsetAttempts % 2 === 0 ? 25 : -25);
                    labelY = sp.screenY - sp.buildingScale * 38;
                  } else {
                    labelX += (offsetAttempts % 2 === 0 ? 20 : -20);
                    labelY -= labelH + 2;
                  }
                  offsetAttempts++;
                  break;
                }
              }
            }

            labelRects.push({ x: labelX, y: labelY, w: labelW, h: labelH });

            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = 5;
            ctx.fillText(labelText, labelX, labelY);
            ctx.shadowBlur = 0;
          });
        }

        getBuildingScreenPos(building, centerX, centerY) {
          const scale = (0.5 + (this.cameraDistance / 500) * 0.5) * 1.1;
          const rotatedX = building.x * Math.cos(this.cameraAngle) - building.z * Math.sin(this.cameraAngle);
          const rotatedZ = building.x * Math.sin(this.cameraAngle) + building.z * Math.cos(this.cameraAngle);
          const perspective = Math.max(0.35, 1 - (rotatedZ + this.cameraHeight) / 1000);
          const screenX = centerX + rotatedX * scale * perspective;
          const screenY = centerY - (building.y || 0) * scale * perspective - rotatedZ * scale * 0.3 * perspective;
          const buildingScale = Math.max(1.0, (building.scale || 1) * scale * perspective * 1.0);
          return { screenX, screenY, buildingScale, perspective };
        }

        drawBuildingShape(building, screenX, screenY, buildingScale, centerY) {
          const ctx = this.ctx;
          const safeType = CONFIG.allowedTypes.includes(building.type) ? building.type : '默认';
          const color = CONFIG.buildingColors[safeType];

          ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.beginPath();
          ctx.ellipse(screenX, centerY + 5, buildingScale * 10, buildingScale * 4, 0, 0, Math.PI * 2);
          ctx.fill();

          this.drawBuildingByType(ctx, building, screenX, screenY, buildingScale, color);
        }

        drawBuildingByType(ctx, building, x, y, scale, color) {
          const type = CONFIG.allowedTypes.includes(building.type) ? building.type : '默认';

          switch (type) {
            case '能源设施':
              this.drawEnergyFacility(ctx, x, y, scale, color);
              break;
            case '生命支持':
            case '居住区':
              this.drawHabitat(ctx, x, y, scale, color, building._seed);
              break;
            case '研究中心':
            case '通讯设施':
            case '防御设施':
              this.drawTower(ctx, x, y, scale, color);
              break;
            case '温室':
              this.drawGreenhouse(ctx, x, y, scale, color, building._seed);
              break;
            case '工厂':
              this.drawFactory(ctx, x, y, scale, color);
              break;
            case '交通设施':
              this.drawRoad(ctx, x, y, scale, color);
              break;
            default:
              this.drawDefaultBuilding(ctx, x, y, scale, color);
          }
        }

        // 基于种子的伪随机数生成器，避免每帧闪烁
        seededRandom(seed) {
          let s = seed | 0;
          return function() {
            s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
            return ((s >>> 0) / 0xFFFFFFFF);
          };
        }

        drawEnergyFacility(ctx, x, y, scale, color) {
          ctx.fillStyle = '#555566';
          ctx.beginPath();
          ctx.moveTo(x - scale * 12, y);
          ctx.lineTo(x + scale * 12, y);
          ctx.lineTo(x + scale * 10, y - scale * 8);
          ctx.lineTo(x - scale * 10, y - scale * 8);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(x - scale * 6, y - scale * 8);
          ctx.lineTo(x + scale * 6, y - scale * 8);
          ctx.lineTo(x, y - scale * 30);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(x, y - scale * 15, scale * 10, scale * 4, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        drawHabitat(ctx, x, y, scale, color, seed) {
          const rng = this.seededRandom(seed || 12345);

          ctx.fillStyle = 'rgba(200, 200, 210, 0.7)';
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(x, y - scale * 12, scale * 14, scale * 12, 0, Math.PI, 0);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#777788';
          ctx.beginPath();
          ctx.ellipse(x, y, scale * 14, scale * 5, 0, 0, Math.PI * 2);
          ctx.fill();

          // 使用种子随机生成固定位置的窗户
          for (let i = 0; i < 8; i++) {
            const wx = x + (rng() - 0.5) * scale * 20;
            const wy = y - scale * 5 - rng() * scale * 15;
            ctx.fillStyle = 'rgba(255, 220, 150, 0.8)';
            ctx.beginPath();
            ctx.arc(wx, wy, scale * 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        drawTower(ctx, x, y, scale, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x - scale * 6, y - scale * 35, scale * 12, scale * 35);

          ctx.fillStyle = '#ff3300';
          ctx.shadowColor = '#ff2200';
          ctx.shadowBlur = 10;
          ctx.fillRect(x - scale * 1.5, y - scale * 45, scale * 3, scale * 12);
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#aaaaaa';
          ctx.fillRect(x - scale * 8, y - scale * 25, scale * 16, scale * 2);
        }

        drawGreenhouse(ctx, x, y, scale, color, seed) {
          const rng = this.seededRandom(seed || 54321);

          ctx.fillStyle = 'rgba(85, 204, 136, 0.4)';
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.rect(x - scale * 20, y - scale * 12, scale * 40, scale * 12);
          ctx.fill();
          ctx.stroke();

          // 使用种子随机生成固定位置的植物
          for (let i = 0; i < 12; i++) {
            const px = x - scale * 18 + rng() * scale * 36;
            const py = y - scale * 2 - rng() * scale * 8;
            ctx.fillStyle = '#33aa55';
            ctx.beginPath();
            ctx.arc(px, py, scale * 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        drawFactory(ctx, x, y, scale, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x - scale * 18, y - scale * 15, scale * 36, scale * 15);

          ctx.fillStyle = '#555555';
          ctx.fillRect(x + scale * 10, y - scale * 30, scale * 5, scale * 15);
          ctx.fillRect(x - scale * 12, y - scale * 25, scale * 4, scale * 10);

          ctx.fillStyle = 'rgba(150, 150, 150, 0.3)';
          for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(x + scale * 12 + Math.sin(this.time * 2 + i) * scale * 3, y - scale * 35 - i * scale * 5, scale * 4 + i * scale * 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        drawRoad(ctx, x, y, scale, color) {
          ctx.fillStyle = '#333333';
          ctx.fillRect(x - scale * 25, y - scale * 2, scale * 50, scale * 4);
          ctx.fillStyle = color;
          ctx.fillRect(x - scale * 25, y - scale * 0.5, scale * 50, scale * 1);
        }

        drawDefaultBuilding(ctx, x, y, scale, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x - scale * 10, y);
          ctx.lineTo(x + scale * 10, y);
          ctx.lineTo(x + scale * 8, y - scale * 20);
          ctx.lineTo(x - scale * 8, y - scale * 20);
          ctx.closePath();
          ctx.fill();
        }

        addBuilding(building) {
          if (this.buildings.length >= CONFIG.maxBuildings) {
            this.buildings.shift();
          }
          const seed = Math.floor(Math.random() * 0x7FFFFFFF);
          const newBuilding = {
            ...building,
            y: 0,
            showLabel: true,
            animProgress: 0,
            _seed: seed
          };
          this.buildings.push(newBuilding);

          // 建筑升起动画 - 安全地跟踪动画
          const animId = Symbol('rise');
          this.activeAnimations.add(animId);
          const animateRise = () => {
            if (!this.activeAnimations.has(animId)) return;
            newBuilding.animProgress += 0.03;
            if (newBuilding.animProgress < 1 && this.buildings.includes(newBuilding)) {
              newBuilding.y = -20 * (1 - newBuilding.animProgress);
              requestAnimationFrame(animateRise);
            } else {
              newBuilding.y = 0;
              this.activeAnimations.delete(animId);
            }
          };
          animateRise();
        }

        clearBuildings() {
          this.activeAnimations.clear();
          this.buildings = [];
        }
      }

      // ============ 游戏逻辑 ============
      function createGame(renderer) {
        const state = {
          step: 0,
          auto: false,
          autoTimer: null,
          buildings: [],
          stats: { population: 0, energy: 0, oxygen: 0 },
          history: [],
          processing: false,
          destroyed: false
        };

        function reset() {
          state.step = 0;
          state.buildings = [];
          state.stats = { population: 0, energy: 0, oxygen: 0 };
          state.history = [];
          state.auto = false;
          if (state.autoTimer) {
            clearInterval(state.autoTimer);
            state.autoTimer = null;
          }
          renderer.clearBuildings();

          // 使用 textContent 安全清空
          while (DOM.log.firstChild) DOM.log.removeChild(DOM.log.firstChild);
          while (DOM.buildingList.firstChild) DOM.buildingList.removeChild(DOM.buildingList.firstChild);

          DOM.currentPlan.innerHTML = '<div class="name">—</div><div class="meta">暂无建造计划</div>';
          updateStats();
          setStatus('等待启动');
          DOM.btnAuto.textContent = '自动建造';
          DOM.btnAuto.style.borderColor = '';
          showToast('殖民地已重置');
        }

        async function nextStep() {
          if (state.processing || state.destroyed) return;
          state.processing = true;
          DOM.btnNext.disabled = true;
          const loader = document.createElement('span');
          loader.className = 'loader';
          DOM.btnNext.textContent = '';
          DOM.btnNext.appendChild(loader);
          DOM.btnNext.appendChild(document.createTextNode('AI 思考中...'));
          setStatus('AI 正在规划下一步...');

          try {
            const plan = await fetchPlan();
            applyPlan(plan);
          } catch (err) {
            console.warn('AI plan failed:', err.message);
            showToast('AI 决策失败，请重试');
            setStatus('决策失败，请重试');
          } finally {
            state.processing = false;
            DOM.btnNext.disabled = false;
            DOM.btnNext.textContent = '下一步建造';
          }
        }

        async function fetchPlan() {
          const messages = buildPrompt();
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), CONFIG.requestTimeout);

          try {
            const res = await fetch(CONFIG.apiUrl, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${CONFIG.apiKey}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: CONFIG.model,
                messages: messages,
                max_tokens: CONFIG.maxTokens,
                temperature: 0.75
              }),
              signal: controller.signal
            });

            clearTimeout(timeoutId);

            if (!res.ok) {
              throw new Error(`网络错误 (${res.status})`);
            }

            const data = await res.json();

            if (!data.choices || !data.choices[0] || !data.choices[0].message || !data.choices[0].message.content) {
              throw new Error('AI 返回格式异常');
            }

            const content = data.choices[0].message.content;
            return parsePlan(content);
          } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
              throw new Error('请求超时，请检查网络');
            }
            throw err;
          }
        }

        function buildPrompt() {
          const existingCoords = state.buildings.map(b =>
            `(${b.x},${b.z})`).join(', ');

          const summary = state.buildings.length === 0
            ? '火星殖民地尚未建立，这是第一步。请在原点(0,0)附近放置第一个设施。'
            : `当前已建造 ${state.buildings.length} 个设施。\n已有建筑坐标：${existingCoords}\n`;

          const system = `你是 ARES 火星城市规划 AI，负责在火星表面规划自给自足的人类城市。城市范围极其广阔（坐标 ±300），你必须在广袤的土地上合理分散布局，避免拥挤。

**核心规则：**
1. 建筑类型：能源设施、生命支持、居住区、研究中心、温室、工厂、交通设施、防御设施、存储设施、通讯设施
2. 坐标范围 x 和 z 均为 -300 到 300，充分利用广阔空间，远离原点
3. 每座建筑必须与已有建筑保持至少 60 单位距离，严禁重叠，越分散越好
4. 同类设施应在不同区域分散布局，形成多个独立功能区域
5. 早期建筑尽量集中在原点附近（±100），中后期逐步向外扩展（±200 ~ ±300）
6. 返回严格 JSON，不要添加解释文字
7. JSON 字段：building(建筑名), type(类型), reason(50字以内原因), x, z, scale(0.8-1.5)`;

          const user = `第 ${state.step + 1} 步建造决策。\n${summary}\n当前：人口 ${state.stats.population}，能源 ${state.stats.energy}，氧气 ${state.stats.oxygen}。\n请选择与已有建筑间距至少60的坐标，返回 JSON。`;

          return [
            { role: 'system', content: system },
            { role: 'user', content: user }
          ];
        }

        function parsePlan(content) {
          if (typeof content !== 'string') throw new Error('返回内容为空');

          const cleanContent = content.trim();
          const attempts = [];

          const codeMatch = cleanContent.match(/```json\s*([\s\S]*?)```/);
          if (codeMatch) attempts.push(codeMatch[1].trim());
          attempts.push(cleanContent);

          for (const attempt of attempts) {
            try {
              const parsed = JSON.parse(attempt);
              return processPlanObj(Array.isArray(parsed) ? parsed[0] : parsed);
            } catch (e) { /* continue */ }

            const arrayMatch = attempt.match(/\[[\s\S]*\]/);
            if (arrayMatch) {
              try {
                const arr = JSON.parse(arrayMatch[0]);
                if (arr.length > 0) return processPlanObj(arr[0]);
              } catch (e) { /* continue */ }
            }

            const firstBrace = attempt.indexOf('{');
            const lastBrace = attempt.lastIndexOf('}');
            if (firstBrace >= 0 && lastBrace > firstBrace) {
              let json = attempt.substring(firstBrace, lastBrace + 1).trim();
              json = json.replace(/,\s*}/g, '}').replace(/,\s*]/g, ']');

              if (json.match(/\}[,\s]*\{/)) {
                json = '[' + json + ']';
                try {
                  const arr = JSON.parse(json);
                  if (arr.length > 0) return processPlanObj(arr[0]);
                } catch (e) { /* continue */ }
              }

              try {
                const obj = JSON.parse(json);
                return processPlanObj(obj);
              } catch (e) { /* continue */ }
            }
          }

          throw new Error('无法解析AI返回的JSON');
        }

        function processPlanObj(obj) {
          if (!obj || typeof obj !== 'object') throw new Error('返回格式不正确');
          if (!obj.building || !obj.type) throw new Error('返回格式不正确');

          // 白名单验证类型
          let safeType = sanitizeString(obj.type, 10);
          if (!CONFIG.allowedTypes.includes(safeType)) {
            safeType = '默认';
          }

          const safeBuilding = sanitizeString(obj.building, 30);
          const safeReason = sanitizeString(obj.reason, 100);

          const plan = {
            building: safeBuilding || '未知建筑',
            type: safeType,
            reason: safeReason || '无',
            x: sanitizeNumber(obj.x, -CONFIG.coordRange, CONFIG.coordRange, 0),
            z: sanitizeNumber(obj.z, -CONFIG.coordRange, CONFIG.coordRange, 0),
            scale: sanitizeNumber(obj.scale, 0.8, 1.5, 1)
          };

          // 碰撞检测
          let attempts = 0;
          const maxAttempts = 30;
          while (isTooClose(plan) && attempts < maxAttempts) {
            const angle = Math.random() * Math.PI * 2;
            const dist = CONFIG.minSpacing + Math.random() * 60;
            plan.x = sanitizeNumber(plan.x + Math.cos(angle) * dist, -CONFIG.coordRange, CONFIG.coordRange, plan.x);
            plan.z = sanitizeNumber(plan.z + Math.sin(angle) * dist, -CONFIG.coordRange, CONFIG.coordRange, plan.z);
            attempts++;
          }

          return plan;
        }

        function isTooClose(plan) {
          for (const b of state.buildings) {
            const dx = plan.x - b.x;
            const dz = plan.z - b.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist < CONFIG.minSpacing) return true;
          }
          return false;
        }

        function applyPlan(plan) {
          state.step++;
          plan.step = state.step;
          state.buildings.push(plan);
          state.history.push(plan);
          renderer.addBuilding(plan);
          updateStatsFromPlan(plan);
          updateStats();
          addLog(plan);
          updateCurrentPlan(plan);
          updateBuildingList();
          setStatus(`已完成第 ${state.step} 步建造`);
          showToast(`已建造：${plan.building}`);
        }

        function updateStatsFromPlan(plan) {
          switch (plan.type) {
            case '能源设施': state.stats.energy += 25; break;
            case '生命支持': state.stats.oxygen += 20; state.stats.population += 10; break;
            case '居住区': state.stats.population += 40; state.stats.oxygen = Math.max(0, state.stats.oxygen - 5); break;
            case '研究中心': state.stats.energy = Math.max(0, state.stats.energy - 5); state.stats.population += 8; break;
            case '温室': state.stats.oxygen += 30; state.stats.population += 5; break;
            case '工厂': state.stats.energy = Math.max(0, state.stats.energy - 10); state.stats.population += 15; break;
            case '交通设施': state.stats.energy = Math.max(0, state.stats.energy - 2); break;
            case '防御设施': state.stats.energy = Math.max(0, state.stats.energy - 3); break;
            case '存储设施': state.stats.population += 5; break;
            case '通讯设施': state.stats.energy = Math.max(0, state.stats.energy - 4); break;
          }
          state.stats.population = Math.max(0, state.stats.population);
          state.stats.energy = Math.max(0, state.stats.energy);
          state.stats.oxygen = Math.max(0, state.stats.oxygen);
        }

        function updateStats() {
          DOM.statBuildings.textContent = state.buildings.length;
          DOM.statPopulation.textContent = state.stats.population;
          DOM.statEnergy.textContent = state.stats.energy;
          DOM.statOxygen.textContent = state.stats.oxygen;
          DOM.solCounter.textContent = Math.max(1, state.step);
        }

        function createLogEntry(step, title, reason) {
          const entry = document.createElement('div');
          entry.className = 'log-entry';

          const stepDiv = document.createElement('div');
          stepDiv.className = 'log-step';
          stepDiv.textContent = `STEP ${step}`;

          const titleDiv = document.createElement('div');
          titleDiv.className = 'log-title';
          titleDiv.textContent = `${title}`;

          const reasonDiv = document.createElement('div');
          reasonDiv.className = 'log-reason';
          reasonDiv.textContent = reason;

          entry.appendChild(stepDiv);
          entry.appendChild(titleDiv);
          entry.appendChild(reasonDiv);
          return entry;
        }

        function addLog(plan) {
          const entry = createLogEntry(plan.step, `${plan.building} · ${plan.type}`, plan.reason);
          DOM.log.insertBefore(entry, DOM.log.firstChild);

          // 限制日志条目数量
          while (DOM.log.children.length > 50) {
            DOM.log.removeChild(DOM.log.lastChild);
          }
        }

        function updateCurrentPlan(plan) {
          DOM.currentPlan.innerHTML = '';

          const nameDiv = document.createElement('div');
          nameDiv.className = 'name';
          nameDiv.textContent = plan.building;

          const metaDiv = document.createElement('div');
          metaDiv.className = 'meta';
          metaDiv.innerHTML =
            `类型：${escapeHtml(plan.type)}<br>` +
            `坐标：(${plan.x.toFixed(1)}, ${plan.z.toFixed(1)})<br>` +
            `规模：${plan.scale.toFixed(2)}`;

          DOM.currentPlan.appendChild(nameDiv);
          DOM.currentPlan.appendChild(metaDiv);
        }

        function updateBuildingList() {
          DOM.buildingList.innerHTML = '';
          const reversed = state.buildings.slice().reverse();
          const maxItems = Math.min(reversed.length, 50);

          for (let i = 0; i < maxItems; i++) {
            const b = reversed[i];
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.padding = '8px 0';

            const stepDiv = document.createElement('div');
            stepDiv.className = 'log-step';
            stepDiv.textContent = `STEP ${b.step}`;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'log-title';
            titleDiv.textContent = b.building;

            const reasonDiv = document.createElement('div');
            reasonDiv.className = 'log-reason';
            reasonDiv.textContent = `${b.type} · (${b.x.toFixed(0)}, ${b.z.toFixed(0)})`;

            entry.appendChild(stepDiv);
            entry.appendChild(titleDiv);
            entry.appendChild(reasonDiv);
            DOM.buildingList.appendChild(entry);
          }
        }

        function setStatus(text) {
          DOM.statusText.textContent = text;
        }

        function toggleAuto() {
          state.auto = !state.auto;
          if (state.auto) {
            DOM.btnAuto.textContent = '停止自动';
            DOM.btnAuto.style.borderColor = 'var(--mars-red)';
            nextStep();
            state.autoTimer = setInterval(() => {
              if (state.auto && !state.processing) {
                nextStep();
              }
            }, 8000);
          } else {
            DOM.btnAuto.textContent = '自动建造';
            DOM.btnAuto.style.borderColor = '';
            if (state.autoTimer) {
              clearInterval(state.autoTimer);
              state.autoTimer = null;
            }
          }
        }

        function destroy() {
          state.destroyed = true;
          state.auto = false;
          if (state.autoTimer) {
            clearInterval(state.autoTimer);
            state.autoTimer = null;
          }
          renderer.destroy();
        }

        return { reset, nextStep, toggleAuto, destroy, state };
      }

      // ============ Toast 提示 ============
      let toastTimer = null;
      function showToast(msg) {
        if (toastTimer) clearTimeout(toastTimer);
        DOM.toast.textContent = sanitizeString(msg, 200);
        DOM.toast.classList.add('show');
        toastTimer = setTimeout(() => DOM.toast.classList.remove('show'), 2800);
      }

      // ============ 初始化 ============
      cacheDOM();
      const canvas = DOM.canvas;
      const renderer = new MarsCityRenderer(canvas);
      const game = createGame(renderer);

      // 事件绑定 - 使用 addEventListener 而非内联 onclick，并保存引用以便清理
      const _onBtnNext = () => game.nextStep();
      const _onBtnAuto = () => game.toggleAuto();
      const _onBtnReset = () => game.reset();
      const _onBeforeUnload = () => {
        game.destroy();
        if (toastTimer) clearTimeout(toastTimer);
      };

      DOM.btnNext.addEventListener('click', _onBtnNext);
      DOM.btnAuto.addEventListener('click', _onBtnAuto);
      DOM.btnReset.addEventListener('click', _onBtnReset);
      window.addEventListener('beforeunload', _onBeforeUnload);

      // 扩展renderer和game的destroy以清理按钮事件
      const originalRendererDestroy = renderer.destroy.bind(renderer);
      renderer.destroy = function() {
        originalRendererDestroy();
        try {
          DOM.btnNext.removeEventListener('click', _onBtnNext);
          DOM.btnAuto.removeEventListener('click', _onBtnAuto);
          DOM.btnReset.removeEventListener('click', _onBtnReset);
          window.removeEventListener('beforeunload', _onBeforeUnload);
        } catch (e) { /* 忽略清理错误 */ }
      };

      // 防止全局暴露，仅在开发环境暴露
      // window.game = game;
      // window.renderer = renderer;

      // 初始化显示
      game.reset();
      showToast('ARES 火星城市准备就绪 · 点击下一步开始建造');
    })();
  </script>
</body>
</html>
